# Runs the full test suite (answer-key checks, app smoke tests, README sync)
# on every pull request and on every push to main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest
